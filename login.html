<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập</title>
  <link rel="stylesheet" href="src/ui/login.css">
</head>
<body>
  <main class="card">
    <h1>Đăng nhập</h1>
    <form id="login-form" novalidate>
      <label>Email <input id="email" type="email" autocomplete="email"></label>
      <p class="error" id="email-error"></p>
      <label>Mật khẩu <input id="password" type="password" autocomplete="current-password"></label>
      <p class="error" id="password-error"></p>
      <button id="submit" type="submit">Đăng nhập</button>
      <p class="error" id="form-error"></p>
    </form>
  </main>
  <script type="module" src="src/ui/loginPage.js"></script>
</body>
</html>
